<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
</head>
<body style="margin: 0; overflow: hidden;">
<script>
  const scene = new THREE.Scene();
  const camera = new THREE.Camera();
  scene.add(camera);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const arSource = new THREEx.ArToolkitSource({ sourceType: 'webcam' });
  const arContext = new THREEx.ArToolkitContext({
    cameraParametersUrl: 'https://jsdelivr.net',
    detectionMode: 'mono'
  });

  function onResize() {
    arSource.onResizeElement();
    arSource.copyElementSizeTo(renderer.domElement);
    if (arContext.arController) arSource.copyElementSizeTo(arContext.arController.canvas);
  }

  arSource.init(onResize);
  window.addEventListener('resize', onResize);

  arContext.init(() => camera.projectionMatrix.copy(arContext.getProjectionMatrix()));

  const markerRoot = new THREE.Group();
  scene.add(markerRoot);
  new THREEx.ArMarkerControls(arContext, markerRoot, {
    type: 'pattern',
    patternUrl: 'https://jsdelivr.net'
  });

  const cube = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshNormalMaterial({ transparent: true, opacity: 0.5 })
  );
  cube.position.y = 0.5;
  markerRoot.add(cube);

  function animate() {
    requestAnimationFrame(animate);
    if (arSource.ready) arContext.update(arSource.domElement);
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
